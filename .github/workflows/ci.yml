name: CI - Docker Compose Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backend/.env from secrets
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build containers
        run: docker compose build --no-cache

      - name: Start containers in background
        run: docker compose up -d

      - name: Wait for backend to be healthy
        run: |
          for i in {1..30}; do
            if docker compose exec backend curl -s http://localhost:3001/health; then
              echo "Backend is healthy."
              break
            else
              echo "Waiting for backend to be healthy..."
              sleep 5
            fi
            if [ $i -eq 30 ]; then
              echo "Backend failed to become healthy."
              exit 1
            fi
          done

      # Run backend tests inside container
      - name: Run backend tests with coverage
        run: docker compose exec backend npm run test:coverage

      # Copy backend coverage out
      - name: Copy backend coverage report
        run: docker cp backend:/app/coverage ./backend-coverage

      # Run frontend tests inside container
      - name: Run frontend tests with coverage
        run: docker compose exec frontend npm run test -- --coverage

      # Copy frontend coverage out
      - name: Copy frontend coverage report
        run: docker cp frontend:/app/coverage ./frontend-coverage

      # Run Playwright E2E tests
      - name: Run Playwright tests
        run: docker compose exec frontend npx playwright test

      # Upload artifacts
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./backend-coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ./frontend-coverage

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Tear down containers
        if: always()
        run: docker compose down -v
